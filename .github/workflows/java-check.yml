name: Java compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/RestaurantManagementSystem.java tests/RestaurantManagementSystemTest.java
          java -cp out RestaurantManagementSystemTest
      - name: Smoke test application startup and exit
        run: |
          printf '0\n' | java -cp out RestaurantManagementSystem
      - name: Smoke test order, billing, payment, and history
        run: |
          output="$(printf '5\nTest Customer\nN/A\n1\n1\n0\n1\n6\n0\n' | java -cp out RestaurantManagementSystem)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -F 'Order No : 1001'
          printf '%s' "$output" | grep -F 'Date/Time:'
          printf '%s' "$output" | grep -F 'TOTAL:'
          printf '%s' "$output" | grep -F 'ORDER HISTORY'
          printf '%s' "$output" | grep -F 'Payment: Cash'
          printf '%s' "$output" | grep -F '₹126.00'
